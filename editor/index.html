<!DOCTYPE html>
<html>
  <head>
    <title>2D Scene with Three.js</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script>
      // 1. Create renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 2. Create a 2D camera (orthographic)
      const aspect = window.innerWidth / window.innerHeight;
      const camera = new THREE.OrthographicCamera(
        -aspect, aspect, 1, -1, 0.1, 10
      );
      camera.position.z = 1;

      // 3. Create a scene
      const scene = new THREE.Scene();

      // 4. Create a 2D rectangle (plane)
      const geometry = new THREE.PlaneGeometry(0.5, 0.5); // width, height
      const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const square = new THREE.Mesh(geometry, material);
      square.position.x = 0.5;
      scene.add(square);

      // 5. Animation loop
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
